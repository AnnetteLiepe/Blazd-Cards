<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');

  :root{
    --bg:#000000; --bg2:#0a0a0a; --card:#141416; --card-hi:#1a1a1d; --line:#232326;
    --white:#ffffff; --mute:#8e8e93;
    --gold-l:#f6d488; --gold:#e6b64d; --gold-d:#b8862a;
    --red:#ff5f45; --green:#3ecf6e;
    --shadow: 0 16px 32px -18px rgba(0,0,0,0.9);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background: var(--bg);
    color:var(--white); font-family:'Inter', -apple-system, sans-serif; min-height:100%;
  }
  #app{max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; padding-bottom:20px;}

  header{ padding:26px 20px 10px; text-align:center; }
  .eyebrow{ font-weight:600; letter-spacing:0.14em; text-transform:uppercase; font-size:11px; color:var(--mute);}
  h1{
    font-weight:800; font-size:30px; margin:6px 0 0; line-height:1.05; letter-spacing:-0.01em;
    background:linear-gradient(135deg, var(--gold-l), var(--gold) 55%, var(--gold-d));
    -webkit-background-clip:text; background-clip:text; color:transparent;
  }
  .logo-img{ display:block; margin:0 auto; max-width:220px; width:56%; height:auto; }
  .sub{ color:var(--mute); font-size:14px; margin-top:10px; }

  /* ---------------- SETUP ---------------- */
  #setup{ padding: 18px 20px 20px; display:flex; flex-direction:column; gap:14px; }
  .setup-block{ background:var(--card); border-radius:18px; padding:16px; }
  .setup-label{ font-weight:600; text-transform:uppercase; letter-spacing:0.06em; font-size:11px; color:var(--mute); margin-bottom:12px; }
  .team-count-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .count-btn{
    flex:1 1 30%; min-width:56px; padding:11px 0; border-radius:12px; border:1px solid var(--line); background:var(--bg2);
    color:var(--white); font-weight:600; font-size:14px; cursor:pointer;
  }
  .count-btn.active{ background:linear-gradient(135deg, var(--gold-l), var(--gold-d)); border-color:transparent; color:#1a1200; }
  .team-input{
    width:100%; padding:13px 14px; margin-bottom:8px; border-radius:12px; border:1px solid var(--line);
    background:var(--bg2); color:var(--white); font-size:15px; font-family:'Inter';
  }
  .team-input::placeholder{ color:#5a5a5e; }
  .team-input:last-child{ margin-bottom:0; }
  .cat-legend{ display:flex; flex-wrap:wrap; gap:8px; }
  .cat-chip{ display:flex; align-items:center; gap:7px; font-size:12px; color:var(--mute); background:var(--bg2); border:1px solid var(--line); padding:7px 12px; border-radius:20px; }
  .cat-dot{ width:7px; height:7px; border-radius:50%; background:var(--gold); }
  .start-btn{
    background:linear-gradient(135deg, var(--gold-l), var(--gold) 55%, var(--gold-d)); color:#1a1200; border:none; padding:16px; border-radius:16px;
    font-weight:700; letter-spacing:0.01em; font-size:16px; cursor:pointer;
  }

  /* ---------------- GAME ---------------- */
  #game{ display:none; flex-direction:column; flex:1; padding: 14px 16px 20px; }

  .scoreboard{ display:flex; gap:8px; overflow-x:auto; padding: 6px 2px 16px; }
  .team-chip{
    flex:1; min-width:92px; background:var(--card); border-radius:16px;
    padding:12px 10px; text-align:center; position:relative;
  }
  .team-chip.turn{ box-shadow:0 0 0 1.5px var(--gold); }
  .team-chip .tname{ font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; color:var(--mute); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .team-chip .tscore{ font-weight:800; font-size:24px; color:var(--white); margin-top:2px; }
  .team-chip .turn-flag{ position:absolute; top:-8px; left:50%; transform:translateX(-50%); font-size:14px; }

  .deck-area{ flex:1; display:flex; flex-direction:column; }

  .draw-prompt{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; gap:20px; }
  .draw-prompt .who{ text-transform:uppercase; letter-spacing:0.06em; color:var(--mute); font-size:13px; font-weight:600; }
  .draw-prompt .who b{ color:var(--gold); font-weight:700; }
  .draw-btn{
    background:linear-gradient(135deg, var(--gold-l), var(--gold) 55%, var(--gold-d)); color:#1a1200; border:none;
    padding:18px 42px; border-radius:18px; font-weight:700;
    letter-spacing:0.01em; font-size:17px; cursor:pointer; box-shadow:var(--shadow);
  }

  .card-wrap{ flex:1; display:flex; flex-direction:column; }
  .cat-badge{
    display:inline-flex; align-items:center; gap:6px; align-self:flex-start;
    font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
    font-size:11px; padding:7px 13px; border-radius:20px; margin-bottom:12px;
    background:rgba(230,182,77,0.12); color:var(--gold); border:1px solid rgba(230,182,77,0.3);
  }
  .the-card{
    background:var(--card); border-radius:20px; padding:26px 20px; flex:1; display:flex; flex-direction:column; justify-content:center;
    text-align:center;
  }
  .the-card .task{ font-size:20px; font-weight:600; line-height:1.4; }
  .the-card .points{ margin-top:16px; color:var(--gold); font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; }
  .answer-box{
    margin-top:16px; background:var(--bg2); border:1px dashed var(--line); border-radius:14px; padding:14px;
    font-size:15px; color:var(--mute);
  }
  .answer-box b{ color:var(--white); }

  .action-row{ display:flex; gap:10px; margin-top:16px; }
  .btn{
    flex:1; padding:15px 10px; border-radius:14px; border:none;
    font-weight:700; letter-spacing:0.01em; font-size:14px; cursor:pointer;
  }
  .btn-ghost{ background:var(--bg2); border:1px solid var(--line); color:var(--white); }
  .btn-yes{ background:var(--green); color:#04210f; }
  .btn-no{ background:var(--bg2); border:1px solid var(--line); color:var(--mute); }
  .btn-reveal{ background:linear-gradient(135deg, var(--gold-l), var(--gold) 55%, var(--gold-d)); color:#1a1200; width:100%; }

  .end-btn{ text-align:center; margin-top:14px; }
  .end-btn a{ color:var(--mute); font-size:12px; text-decoration:underline; cursor:pointer; }

  /* ---------------- FINAL ---------------- */
  #final{ display:none; flex:1; flex-direction:column; align-items:center; justify-content:center; padding:30px 24px; text-align:center; }
  #final .trophy{ font-size:52px; margin-bottom:8px; }
  #final .winner{ font-weight:800; font-size:26px; margin-bottom:16px; color:var(--white); }
  .final-list{ width:100%; max-width:320px; }
  .final-row{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:var(--card); border-radius:14px; margin-bottom:8px; }
  .final-row .fr-rank{ color:var(--mute); margin-right:8px; font-weight:600; }
  .final-row .fr-score{ color:var(--gold); font-weight:800; }
  .restart-btn{
    margin-top:20px; background:var(--card); border:1px solid var(--line); color:var(--white);
    padding:14px 28px; border-radius:14px; font-weight:700;
    letter-spacing:0.01em; cursor:pointer;
  }
</style>
</head>

/* ---------------- STATE ---------------- */
let teams = [];
let turnIndex = 0;
let deck = [];
let deckPos = 0;
let currentCard = null;
let answerRevealed = false;

/* ---------------- SETUP SCREEN ---------------- */
let teamCount = 2;
function renderSetup(){
  const countRow = document.getElementById('count-row');
  countRow.innerHTML = '';
  [2,3,4,5,6].forEach(n => {
    const b = document.createElement('button');
    b.className = 'count-btn' + (n === teamCount ? ' active' : '');
    b.textContent = n + ' Teams';
    b.onclick = () => { teamCount = n; renderSetup(); };
    countRow.appendChild(b);
  });

  document.getElementById('count-label').textContent = 'Wie viele Teams? · ' + teamCount + ' Teams treten gegeneinander an';
  document.getElementById('names-label').textContent = 'Teamnamen';

  const inputsWrap = document.getElementById('team-inputs');
  const existing = Array.from(inputsWrap.querySelectorAll('input')).map(i => i.value);
  inputsWrap.innerHTML = '';
  for(let i = 0; i < teamCount; i++){
    const inp = document.createElement('input');
    inp.className = 'team-input';
    inp.placeholder = 'Team ' + (i+1);
    inp.value = existing[i] || '';
    inp.id = 'team-name-' + i;
    inputsWrap.appendChild(inp);
  }
}
renderSetup();

function startGame(){
  teams = [];
  for(let i = 0; i < teamCount; i++){
    const val = document.getElementById('team-name-' + i).value.trim();
    teams.push({ name: val || ('Team ' + (i+1)), score: 0 });
  }
  turnIndex = 0;
  deck = [...CARDS].sort(() => Math.random() - 0.5);
  deckPos = 0;
  document.getElementById('setup').style.display = 'none';
  document.getElementById('game').style.display = 'flex';
  document.getElementById('final').style.display = 'none';
  renderScoreboard();
  renderDrawPrompt();
}

/* ---------------- SCOREBOARD ---------------- */
function renderScoreboard(){
  const sb = document.getElementById('scoreboard');
  sb.innerHTML = '';
  teams.forEach((t, i) => {
    const chip = document.createElement('div');
    chip.className = 'team-chip' + (i === turnIndex ? ' turn' : '');
    chip.innerHTML = (i === turnIndex ? '<div class="turn-flag">⚽</div>' : '') +
      '<div class="tname">' + escapeHtml(t.name) + '</div>' +
      '<div class="tscore">' + t.score + '</div>';
    sb.appendChild(chip);
  });
}
function escapeHtml(s){
  return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ---------------- DRAW / CARD FLOW ---------------- */
function renderDrawPrompt(){
  const area = document.getElementById('deck-area');
  area.innerHTML = `
    <div class="draw-prompt">
      <div style="font-size:44px;">🎴</div>
      <div class="who">Am Zug: <b>${escapeHtml(teams[turnIndex].name)}</b></div>
      <button class="draw-btn" onclick="drawCard()">Karte ziehen</button>
    </div>
  `;
}

function drawCard(){
  if(deckPos >= deck.length){ deck = [...CARDS].sort(() => Math.random() - 0.5); deckPos = 0; }
  currentCard = deck[deckPos];
  deckPos++;
  answerRevealed = false;
  renderCard();
}

function renderCard(){
  const cat = CATS[currentCard.type];
  const area = document.getElementById('deck-area');
  let html = `
    <div class="card-wrap">
      <span class="cat-badge">${cat.label}</span>
      <div class="the-card">
        <div class="task">${escapeHtml(currentCard.text)}</div>
        <div class="points">${cat.points} Punkt${cat.points>1?'e':''} bei Erfolg</div>
  `;
  if(currentCard.type === 'wissen'){
    if(answerRevealed){
      html += `<div class="answer-box"><b>Antwort:</b> ${escapeHtml(currentCard.answer)}</div>`;
    }
  }
  html += `</div>`;

  if(currentCard.type === 'wissen' && !answerRevealed){
    html += `<button class="btn btn-reveal" style="margin-top:16px;" onclick="revealAnswer()">Antwort zeigen</button>`;
  } else {
    html += `
      <div class="action-row">
        <button class="btn btn-no" onclick="scoreCard(false)">❌ Nicht geschafft</button>
        <button class="btn btn-yes" onclick="scoreCard(true)">✅ Geschafft (+${cat.points})</button>
      </div>
    `;
  }
  html += `</div>`;
  area.innerHTML = html;
}

function revealAnswer(){
  answerRevealed = true;
  renderCard();
}

function scoreCard(success){
  if(success){
    teams[turnIndex].score += CATS[currentCard.type].points;
  }
  turnIndex = (turnIndex + 1) % teams.length;
  renderScoreboard();
  renderDrawPrompt();
}

/* ---------------- END GAME ---------------- */
function endGame(){
  document.getElementById('game').style.display = 'none';
  document.getElementById('final').style.display = 'flex';
  const sorted = [...teams].sort((a,b) => b.score - a.score);
  document.getElementById('final-winner').textContent = sorted[0].name + ' gewinnt!';
  const list = document.getElementById('final-list');
  list.innerHTML = '';
  sorted.forEach((t, i) => {
    const row = document.createElement('div');
    row.className = 'final-row';
    row.innerHTML = `<span><span class="fr-rank">${i+1}.</span>${escapeHtml(t.name)}</span><span class="fr-score">${t.score} Pkt</span>`;
    list.appendChild(row);
  });
}

function resetAll(){
  document.getElementById('final').style.display = 'none';
  document.getElementById('setup').style.display = 'flex';
}
</script>
